[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beeai-datacircle"
version = "0.1.0"
description = "BeeAI Framework tools for the Datacircle API: find the best GTM APIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["beeai-framework>=0.1.30", "httpx>=0.27", "pydantic>=2.10"]
keywords = ["beeai", "beeai-framework", "agents", "tools", "requirement-agent", "gtm", "api", "api-pricing", "b2b-data", "datacircle"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://datacircle.dev"
Documentation = "https://api.datacircle.dev/v1/openapi.json"
Repository = "https://github.com/waynehamadi/beeai-datacircle-py"

[dependency-groups]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/beeai_datacircle"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]
